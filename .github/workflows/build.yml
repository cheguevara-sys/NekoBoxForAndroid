name: Build Guevarah VPN APK
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Android NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-ndk

      - name: Build libcore.aar
        run: |
          cd libcore
          chmod +x init.sh build.sh
          ./init.sh
          ./build.sh

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Guevarah-VPN-APK
          path: app/build/outputs/apk/release/*.apk
