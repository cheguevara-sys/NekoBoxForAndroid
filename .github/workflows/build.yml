name: Build Guevarah VPN

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Android NDK r25c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build Go core (libcore)
        run: |
          cd libcore
          chmod +x init.sh build.sh
          ./init.sh
          ./build.sh

      - name: Build Release APK (Standard flavor)
        run: |
          chmod +x gradlew
          ./gradlew assembleStandardRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Guevarah-VPN-APK
          path: app/build/outputs/apk/standard/release/*.apk
